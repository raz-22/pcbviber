## Fly.io config for the Altium MCP server + SPA.
## NOTE: do NOT `fly deploy` until auth is added. The server currently has no
## access control. See README § Deployment.

app = "altium-mcp"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  HTTP_HOST = "0.0.0.0"
  HTTP_PORT = "3000"
  NODE_ENV = "production"

[[services]]
  protocol = "tcp"
  internal_port = 3000

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [services.concurrency]
    type = "connections"
    hard_limit = 100
    soft_limit = 50

  [[services.http_checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"
    method = "get"
    path = "/api/health"
    protocol = "http"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
