name: publish to npm

# Manual, one-shot: publishes apps/local to the npm registry as `pcbviber`,
# then registers it in the MCP registry. Authenticates with npm trusted
# publishing (OIDC): no token or secret. The trusted publisher is configured in
# the package settings on npmjs.com for this repository and workflow file.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm -F pcbviber test
      - name: Publish to npm
        working-directory: apps/local
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "pcbviber@$VERSION" version >/dev/null 2>&1; then
            echo "pcbviber@$VERSION is already on npm, skipping."
          else
            npm publish --access public
          fi
      - name: Register in the MCP registry
        working-directory: apps/local
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
