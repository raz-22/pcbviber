name: release

# Builds the pcbviber package and attaches the tarball to a GitHub release,
# so it can be installed without the npm registry:
#   npx -y https://github.com/raz-22/pcbviber/releases/latest/download/pcbviber.tgz
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm -F pcbviber test
      - name: Pack
        working-directory: apps/local
        run: |
          npm pack
          cp pcbviber-*.tgz pcbviber.tgz
          echo "VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"
      - name: Verify the tarball installs and runs
        run: |
          mkdir /tmp/verify && cd /tmp/verify && npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE/apps/local/pcbviber-$VERSION.tgz"
          test "$(./node_modules/.bin/pcbviber --version)" = "$VERSION"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$VERSION"
          FILE="apps/local/pcbviber-$VERSION.tgz"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$FILE" apps/local/pcbviber.tgz --clobber
          else
            gh release create "$TAG" "$FILE" apps/local/pcbviber.tgz --target "$GITHUB_SHA" --title "pcbviber $VERSION" \
              --notes "Install: \`npx -y https://github.com/raz-22/pcbviber/releases/latest/download/pcbviber.tgz\`. See the README for setup and verification status."
          fi
